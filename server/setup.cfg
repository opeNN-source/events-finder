# Вся конфигурация для плагинов и других утилит определена здесь.
# Подробнее о `setup.cfg`:
# https://docs.python.org/3.11/distutils/configfile.html


[flake8]
# Конфигурация flake8:
# https://flake8.pycqa.org/en/latest/user/configuration.html
format = wemake
show-source = true
statistics = false

# Плагины Flake:
max-line-length = 80
max-complexity = 6

extend-exclude = .venv

# Запускаем только wemake-python-styleguide и системные проверки:
select = WPS, E99

# Документация: https://github.com/snoack/flake8-per-file-ignores
# Можно полностью или частично отключить наши кастомные проверки,
# для этого нужно игнорировать `WPS` для всех python файлов:
per-file-ignores =
  # Разрешить `__init__.py` с логикой для конфигурации:
  server/settings/*.py: WPS226, WPS407, WPS412, WPS432
  # Включить ключевое слово `assert` и магические числа для тестов:
  tests/*.py: WPS432


[tool:pytest]
# Конфигурация pytest:
# https://docs.pytest.org/en/stable/customize.html

# Таймаут для тестов, чтобы они не выполнялись дольше
# указанного количества секунд.
# Рекомендуется установить минимально возможное значение.
# Конфигурация:
# https://pypi.org/project/pytest-timeout/
timeout = 5

# Строгий режим `@xfail` по умолчанию:
xfail_strict = true

# Директории, которые не посещаются сборщиком pytest:
norecursedirs = *.egg .eggs dist build docs .tox .git __pycache__ .hypothesis

# Нужно измерить скорость тестов с `-n auto` и без него,
# чтобы понять, дает ли это прирост производительности или создает доп расходы.
# См. `docs/template/development-process.rst`.
addopts =
  --strict-markers
  --strict-config
  --fail-on-template-vars
  # Вывод:
  --tb=short
  # Покрытие:
  --cov=server
  --cov=tests
  --cov-branch
  --cov-report=term-missing:skip-covered
  --cov-report=html
  --cov-report=xml
  --cov-fail-under=100

filterwarnings =
  error


[coverage:run]
# Конфигурация coverage:
# https://coverage.readthedocs.io/en/latest/config.html
plugins =
  # Документация: https://pypi.org/project/covdefaults
  covdefaults


[mypy]
# Конфигурация Mypy:
# https://mypy.readthedocs.io/en/latest/config_file.html
enable_error_code =
  truthy-bool,
  truthy-iterable,
  redundant-expr,
  unused-awaitable,
  ignore-without-code,
  possibly-undefined,
  redundant-self,
  explicit-override,
  mutable-override,
  unimported-reveal,
  deprecated,
  exhaustive-match,

explicit_package_bases = true
ignore_missing_imports = true
local_partial_types = true
strict = true
strict_bytes = true
warn_unreachable = true
