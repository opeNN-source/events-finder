---
# Этот файл необходим для привязки портов в режиме разработки.
# Это связано с тем, как директива `ports` объединяется из двух файлов.
#
# Этот файл автоматически подхватывается в режиме разработки командой:
#
#  $ docker compose up

services:
  server:
    ports:
      # Привязываем порты напрямую только в режиме разработки:
      - "8000:8000"
    volumes:
      # Монтируем исходный код только в режиме разработки:
      - .:/server
    build:
      # Необходимо для исправления прав доступа к файлам, созданным Docker
      args:
        - UID=${UID:-1000}
        - GID=${GID:-1000}
    networks:
      - server-net
      - postgres-net
      - shared_network

networks:
  # Сеть для postgres, только у server должен быть доступ к БД:
  postgres-net:
  # Сеть для внутренних сервисов, используйте её по умолчанию:
  server-net:
  shared_network:
    external:
      name: shared_network
