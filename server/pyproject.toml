[project]
name = "server"
description = "Server приложения для поиска мероприятий"
version = "0.1.0"
requires-python = "==3.13.5"
readme = "README.md"
authors = []
dependencies = [
  "litestar",
  "lite-bootstrap[litestar-all]",
  "modern-di-litestar",
  "advanced-alchemy",
  "pydantic-settings",
  "granian[uvloop]",
  "alembic",
  "psycopg2",
  "sqlalchemy[asyncio]",
  "asyncpg",
  "opentelemetry-exporter-otlp-proto-grpc",
  "opentelemetry-instrumentation-asyncpg",
  "opentelemetry-instrumentation-sqlalchemy",
  "grpcio>=1.76.0",
  "grpcio-tools>=1.76.0",
  "protobuf>=6.33.1",
]

[project.optional-dependencies]
dev = [
  "wemake-python-styleguide>=1.4.0",
  "ruff>=0.13.0",
  "pytest>=8.3.0",
  "pytest-cov>=7.0.0",
  "covdefaults>=2.3.0",
  "pytest-randomly>=4.0.0",
  "pytest-timeout>=2.3.0",
  "hypothesis>=6.123.0",
  "yamllint>=1.35.0",
  "dotenv-linter>=0.7.0",
  "ipython>=9.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.ruff]
# Конфигурация Ruff: https://docs.astral.sh/ruff/settings
preview = true
fix = true
target-version = "py313"
line-length = 80

[tool.ruff.format]
quote-style = "single"
docstring-code-format = true

[tool.ruff.lint]
select = [
  "A",    # flake8-builtins
  "B",    # flake8-bugbear
  "C4",   # flake8-comprehensions
  "C90",  # maccabe
  "COM",  # flake8-commas
  "D",    # pydocstyle
  "DTZ",  # flake8-datetimez
  "E",    # pycodestyle
  "ERA",  # flake8-eradicate
  "EXE",  # flake8-executable
  "F",    # pyflakes
  "FA",   # flake8-future-annotations
  "FBT",  # flake8-boolean-trap
  "FLY",  # pyflint
  "FURB", # refurb
  "G",    # flake8-logging-format
  "I",    # isort
  "ICN",  # flake8-import-conventions
  "ISC",  # flake8-implicit-str-concat
  "LOG",  # flake8-logging
  "N",    # pep8-naming
  "PERF", # perflint
  "PIE",  # flake8-pie
  "PL",   # pylint
  "PT",   # flake8-pytest-style
  "PTH",  # flake8-use-pathlib
  "Q",    # flake8-quotes
  "RET",  # flake8-return
  "RSE",  # flake8-raise
  "RUF",  # ruff
  "S",    # flake8-bandit
  "SIM",  # flake8-simpify
  "SLF",  # flake8-self
  "SLOT", # flake8-slots
  "T100", # flake8-debugger
  "TRY",  # tryceratops
  "UP",   # pyupgrade
  "W",    # pycodestyle
  "YTT",  # flake8-2020
]
ignore = [
  "A005",   # разрешить затенение имен модулей stdlib и builtin
  "COM812", # завершающая запятая, конфликтует с `ruff format`
  # Различные правила документации, которые нам не важны:
  "D100",
  "D104",
  "D106",
  "D203",
  "D212",
  "D401",
  "D404",
  "D405",
  "ISC001",  # неявная конкатенация строк конфликтует с `ruff format`
  "ISC003",  # предпочитать явную конкатенацию строк вместо неявной
  "PLR09",   # у нас свои правила сложности
  "PLR2004", # не сообщать о магических числах
  "PLR6301", # не требовать classmethod / staticmethod когда self не используется
  "TRY003",  # длинные сообщения об ошибках от `tryceratops`
]
external = [ "WPS" ]

# Конфигурация плагинов:
flake8-quotes.inline-quotes = "single"
mccabe.max-complexity = 6
pydocstyle.convention = "google"

[tool.ruff.lint.per-file-ignores]
"server/apps/*/migrations/*.py" = ["D101", "E501", "RUF012"]
"server/common/typing/*.py" = ["F401"]
"tests/*.py" = ["S101"]
