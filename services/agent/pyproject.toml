[project]
name = "agent"
version = "0.1.0"
description = "AI-агент для поиска, фильтрации и структурирования информации о мероприятиях."
readme = "README.md"
requires-python = "==3.13.5"
dependencies = [
    "certifi>=2025.11.12",
    "googleapis-common-protos>=1.72.0",
    "grpcio>=1.76.0",
    "grpcio-tools>=1.76.0",
    "httpx>=0.28.1",
    "langchain-gigachat>=0.3.12",
    "langgraph>=0.2,<0.3",
    "loguru>=0.7.3",
    "pydantic-settings>=2.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
